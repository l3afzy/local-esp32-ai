; Flash:   pio run -t upload                  (any ESP32 with 4 MB flash, 2M model)
;          pio run -e esp32-s3-16mb -t upload (ESP32-S3 with 16 MB flash, 13M model)
; Chat:    pio device monitor
[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
; the model file is embedded in flash as-is (see embed_model.py)
extra_scripts = pre:embed_model.py
custom_model = data/model.bin
; the 2M model (~3 MB) needs one 3.9 MB app partition on a 4 MB flash
board_build.partitions = partitions.csv
build_unflags = -Os
build_flags = -O2

[env:esp32dev]
board = esp32dev
; Answers stream the weights from flash, so flash speed is answer speed.
; PlatformIO's esp32dev default is 40 MHz DIO; the Arduino IDE's "ESP32 Dev
; Module" default (and what ESP32-WROOM/WROVER modules support) is 80 MHz QIO:
; about 4x the read bandwidth. If a board won't boot, change these back.
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Same at 80 MHz DIO: for a board that won't boot in QIO mode, and for the
; ESP32 emulator (QEMU), which can't switch its flash to QIO.
[env:esp32dev-dio]
board = esp32dev
board_build.f_flash = 80000000L
board_build.flash_mode = dio

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32-c3]
board = esp32-c3-devkitm-1

; The large 13M-parameter model (~10 MB) for ESP32-S3 boards with 16 MB flash,
; e.g. ESP32-S3-DevKitC-1 N16R8 or LilyGO T-Deck.
[env:esp32-s3-16mb]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16711680
board_build.partitions = partitions_16mb.csv
custom_model = data/model_large.bin
