; Flash:   pio run -t upload
; Chat:    pio device monitor
[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
; the model is ~720 KB of const data in flash; give the app room
board_build.partitions = huge_app.csv
build_unflags = -Os
build_flags = -O2

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32-c3]
board = esp32-c3-devkitm-1
