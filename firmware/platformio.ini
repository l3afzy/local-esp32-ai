; Flash:   pio run -t upload
; Chat:    pio device monitor
[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
; the model (~2.8 MB of const data) lives in the app image: use one 3.9 MB
; app partition on a 4 MB flash (see partitions.csv)
board_build.partitions = partitions.csv
build_unflags = -Os
build_flags = -O2

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32-c3]
board = esp32-c3-devkitm-1
